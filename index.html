<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Tag -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A short survey about the languages, tools and operating systems programmers use around the world.">
    <meta name="theme-color" content="#0b1220">

    <!-- Title -->
    <title>Programmers Survey Form</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">

    <!-- Style -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header id="heading" class="glass">
        <h1 id="title">Programmers Talent!</h1>
        <p id="description">We love to know which technologies and tools software engineers use worldwide. Every developer's opinion is precious to us!</p>
    </header>

    <main id="main">

        <form id="survey-form" class="glass" action="#" method="post">

            <fieldset class="group">
                <legend class="sr-only">About you</legend>

                <div class="field">
                    <label id="name-label" for="name">Name <span class="req" aria-hidden="true">*</span></label>
                    <input id="name" type="text" name="name" class="form" required autocomplete="name" placeholder="Full Name">
                </div>

                <div class="field">
                    <label id="email-label" for="email">Email <span class="req" aria-hidden="true">*</span></label>
                    <input id="email" type="email" name="email" class="form" required autocomplete="email" placeholder="example@mail.com">
                </div>

                <div class="field">
                    <label id="number-label" for="number">Age <span class="hint">(optional)</span></label>
                    <input id="number" type="number" name="age" class="form" min="12" max="99" inputmode="numeric" placeholder="12+">
                </div>
            </fieldset>

            <div class="field">
                <label id="dropdown-label" for="dropdown">Programming language you are an expert at</label>
                <select id="dropdown" name="expert-lang" class="form" required>
                    <option value="" disabled selected>Select a language</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="go">Go</option>
                    <option value="java">Java</option>
                    <option value="javascript">JavaScript</option>
                    <option value="php">PHP</option>
                    <option value="python">Python</option>
                    <option value="ruby">Ruby</option>
                    <option value="rust">Rust</option>
                    <option value="typescript">TypeScript</option>
                </select>
            </div>

            <fieldset class="group">
                <legend id="job-label">Employment status</legend>
                <label class="choice"><input type="radio" class="radio-inline" name="employment" value="employed" checked> Full-time employee</label>
                <label class="choice"><input type="radio" class="radio-inline" name="employment" value="freelancer"> Part-time / freelancer</label>
                <label class="choice"><input type="radio" class="radio-inline" name="employment" value="job-seeker"> Looking for a job</label>
                <label class="choice"><input type="radio" class="radio-inline" name="employment" value="student"> Student</label>
            </fieldset>

            <fieldset class="group">
                <legend id="os-label">Operating system experience</legend>
                <label class="choice"><input type="checkbox" name="os" value="windows" checked> Windows</label>
                <label class="choice"><input type="checkbox" name="os" value="linux"> Linux</label>
                <label class="choice"><input type="checkbox" name="os" value="macos"> macOS</label>
            </fieldset>

            <div class="field">
                <label id="learn-label" for="learn-dropdown">Programming language you want to master</label>
                <select id="learn-dropdown" name="learn-lang" class="form">
                    <option value="" disabled selected>Select a language</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="go">Go</option>
                    <option value="java">Java</option>
                    <option value="javascript">JavaScript</option>
                    <option value="php">PHP</option>
                    <option value="python">Python</option>
                    <option value="ruby">Ruby</option>
                    <option value="rust">Rust</option>
                    <option value="typescript">TypeScript</option>
                </select>
            </div>

            <fieldset class="group">
                <legend id="tech-label">Technology experience</legend>
                <label class="choice"><input type="checkbox" name="tech" value="flutter"> Flutter</label>
                <label class="choice"><input type="checkbox" name="tech" value="nodejs"> Node.js</label>
                <label class="choice"><input type="checkbox" name="tech" value="react"> React</label>
                <label class="choice"><input type="checkbox" name="tech" value="tensorflow"> TensorFlow</label>
                <label class="choice"><input type="checkbox" name="tech" value="docker"> Docker</label>
                <label class="choice"><input type="checkbox" name="tech" value="git"> Git &amp; GitHub</label>
                <label class="choice"><input type="checkbox" name="tech" value="devops"> DevOps / CI-CD</label>
            </fieldset>

            <div class="field">
                <label id="comments-label" for="comments">Do you have any suggestions about this survey?</label>
                <textarea id="comments" name="comments" class="form" rows="5" placeholder="Please feel free to write a review..."></textarea>
            </div>

            <button id="submit" type="submit" class="form">Submit</button>
        </form>

    </main>

    <!-- <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script> -->
</body>

</html>
